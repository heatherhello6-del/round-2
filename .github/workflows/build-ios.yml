name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download round 2 iOS zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 2.0 \
            --repo heatherhello6-del/round-2 \
            --pattern "round.2.zip" \
            --output ios.zip

      - name: Unzip iOS project
        run: |
          mkdir -p iosbuild
          unzip -q ios.zip -d iosbuild

      - name: Find Unity iOS root
        run: |
          PODFILE=$(find iosbuild -type f -name "Podfile" -print -quit)

          if [ -z "$PODFILE" ]; then
            echo "ERROR: Could not find Podfile"
            find iosbuild -maxdepth 3 -type f | head -100
            exit 1
          fi

          ROOT=$(dirname "$PODFILE")

          echo "Found Podfile:"
          echo "$PODFILE"

          echo "Found project root:"
          echo "$ROOT"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install CocoaPods
        run: |
          PODFILE=$(find iosbuild -type f -name "Podfile" -print -quit)
          ROOT=$(dirname "$PODFILE")

          cd "$ROOT"
          pod install

      - name: Build Unity iOS app
        run: |
          PODFILE=$(find iosbuild -type f -name "Podfile" -print -quit)
          ROOT=$(dirname "$PODFILE")

          cd "$ROOT"

          if [ -d "Unity-iPhone.xcworkspace" ]; then
            echo "Building workspace..."

            xcodebuild \
              -workspace Unity-iPhone.xcworkspace \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$GITHUB_WORKSPACE/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            echo "Building Xcode project..."

            xcodebuild \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$GITHUB_WORKSPACE/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Create unsigned IPA
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            -print \
            -quit)

          echo "Found app: $APP"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry FlappyCraftz-Round2-Unsigned.ipa Payload

          ls -lh FlappyCraftz-Round2-Unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlappyCraftz-Round2-IPA
          path: FlappyCraftz-Round2-Unsigned.ipa
          if-no-files-found: error
