name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repo
        uses: actions/checkout@v4


      # =========================================================
      # DOWNLOAD LATEST UNITY IOS EXPORT
      # =========================================================

      - name: Download latest iOS zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            --repo heatherhello6-del/round-2 \
            --pattern "round.2.zip" \
            --output ios.zip


      # =========================================================
      # UNZIP IOS PROJECT
      # =========================================================

      - name: Unzip iOS project
        run: |
          mkdir -p iosbuild
          unzip -q ios.zip -d iosbuild


      # =========================================================
      # FIND UNITY IOS PROJECT
      # =========================================================

      - name: Find Unity iOS root
        run: |
          PODFILE=$(find iosbuild -type f -name "Podfile" -print -quit)

          if [ -z "$PODFILE" ]; then
            echo "ERROR: Could not find Podfile"

            echo "Files found:"
            find iosbuild -maxdepth 3 -type f | head -100

            exit 1
          fi

          ROOT=$(dirname "$PODFILE")

          echo "Found Podfile:"
          echo "$PODFILE"

          echo "Found Unity iOS root:"
          echo "$ROOT"


      # =========================================================
      # FIX UNITY SHELL SCRIPT PERMISSIONS
      # =========================================================

      - name: Fix Unity script permissions
        run: |
          PODFILE=$(find iosbuild -type f -name "Podfile" -print -quit)

          if [ -z "$PODFILE" ]; then
            echo "ERROR: Could not find Podfile"
            exit 1
          fi

          ROOT=$(dirname "$PODFILE")

          echo "Fixing executable permissions inside:"
          echo "$ROOT"

          find "$ROOT" -type f -name "*.sh" -exec chmod +x {} \;

          if [ -f "$ROOT/usymtool" ]; then
            chmod +x "$ROOT/usymtool"
          fi

          if [ -f "$ROOT/usymtoolarm64" ]; then
            chmod +x "$ROOT/usymtoolarm64"
          fi

          echo "Unity script permissions fixed."


      # =========================================================
      # XCODE INFO
      # =========================================================

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version


      # =========================================================
      # INSTALL COCOAPODS
      # REQUIRED FOR ADMOB / LEVELPLAY
      # =========================================================

      - name: Install CocoaPods
        run: |
          PODFILE=$(find iosbuild -type f -name "Podfile" -print -quit)

          if [ -z "$PODFILE" ]; then
            echo "ERROR: Could not find Podfile"
            exit 1
          fi

          ROOT=$(dirname "$PODFILE")

          echo "Running CocoaPods inside:"
          echo "$ROOT"

          cd "$ROOT"

          pod install


      # =========================================================
      # BUILD UNITY IOS APP
      # =========================================================

      - name: Build Unity iOS app
        run: |
          PODFILE=$(find iosbuild -type f -name "Podfile" -print -quit)

          if [ -z "$PODFILE" ]; then
            echo "ERROR: Could not find Podfile"
            exit 1
          fi

          ROOT=$(dirname "$PODFILE")

          cd "$ROOT"

          echo "Current directory:"
          pwd

          if [ -d "Unity-iPhone.xcworkspace" ]; then

            echo "Building Unity-iPhone.xcworkspace..."

            xcodebuild \
              -workspace Unity-iPhone.xcworkspace \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$GITHUB_WORKSPACE/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

          elif [ -d "Unity-iPhone.xcodeproj" ]; then

            echo "Building Unity-iPhone.xcodeproj..."

            xcodebuild \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$GITHUB_WORKSPACE/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

          else

            echo "ERROR: Could not find Unity-iPhone.xcworkspace or Unity-iPhone.xcodeproj"

            ls -la

            exit 1

          fi


      # =========================================================
      # FIND BUILT APP
      # =========================================================

      - name: Find built app
        run: |
          echo "Looking for generated .app..."

          find "$GITHUB_WORKSPACE/build" \
            -maxdepth 8 \
            -type d \
            -name "*.app" \
            -print


      # =========================================================
      # CREATE UNSIGNED IPA
      # =========================================================

      - name: Create unsigned IPA
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            -print \
            -quit)

          echo "Found app:"
          echo "$APP"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced"

            echo "Build products:"
            find "$GITHUB_WORKSPACE/build/Build/Products" \
              -maxdepth 3 \
              -type d \
              -print

            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          zip -qry FlappyCraftz-Unsigned.ipa Payload

          echo "IPA created successfully:"
          ls -lh FlappyCraftz-Unsigned.ipa


      # =========================================================
      # UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlappyCraftz-IPA
          path: FlappyCraftz-Unsigned.ipa
          if-no-files-found: error
