name: Build iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    env:
      IOS_ADMOB_APP_ID: ca-app-pub-5670599260609323~3575503563
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download latest iOS zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view --repo heatherhello6-del/round-2 --json tagName,publishedAt,assets
          gh release download --repo heatherhello6-del/round-2 --pattern "round.2.zip" --output ios.zip
          shasum -a 256 ios.zip

      - name: Unzip and find Unity iOS root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iosbuild
          unzip -q ios.zip -d iosbuild
          PROJECT_FILE=$(find iosbuild -type f -path '*/Unity-iPhone.xcodeproj/project.pbxproj' -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Complete Unity Xcode export not found in round.2.zip."
            exit 1
          fi
          IOS_ROOT=$(cd "$(dirname "$(dirname "$PROJECT_FILE")")" && pwd)
          echo "IOS_ROOT=$IOS_ROOT" >> "$GITHUB_ENV"
          echo "Unity export: $IOS_ROOT"
          test -d "$IOS_ROOT/Data"
          test -d "$IOS_ROOT/Il2CppOutputProject"
          if [ ! -f "$IOS_ROOT/Podfile" ]; then
            echo "::error::Expected AdMob Podfile missing. Upload the complete fresh Unity export."
            exit 1
          fi

      - name: Fix AdMob startup configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, plistlib, re
          root = pathlib.Path(os.environ['IOS_ROOT'])
          app_id = os.environ['IOS_ADMOB_APP_ID']
          if not re.fullmatch(r'ca-app-pub-\d{16}~\d{10}', app_id):
              raise SystemExit('Invalid iOS AdMob APP ID format')
          plist = root / 'Info.plist'
          with plist.open('rb') as f:
              data = plistlib.load(f)
          previous = data.get('GADApplicationIdentifier', '<missing>')
          data['GADApplicationIdentifier'] = app_id
          with plist.open('wb') as f:
              plistlib.dump(data, f, sort_keys=False)
          print(f'Host app AdMob ID: {previous} -> {app_id}')
          PY
          /usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$IOS_ROOT/Info.plist"

      - name: Fix Unity script permissions
        shell: bash
        run: |
          set -euo pipefail
          find "$IOS_ROOT" -type f -name '*.sh' -exec chmod +x {} +
          find "$IOS_ROOT" -type f -name 'usymtool*' -exec chmod +x {} +

      - name: Show Xcode version
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          cd "$IOS_ROOT"
          pod install --repo-update
          test -d Unity-iPhone.xcworkspace

      - name: Build Unity iOS app
        shell: bash
        run: |
          set -euo pipefail
          cd "$IOS_ROOT"
          xcodebuild \
            -workspace Unity-iPhone.xcworkspace \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Verify built app and create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos"
          APP=$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::Xcode produced no .app."
            exit 1
          fi
          ACTUAL_ID=$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$APP/Info.plist")
          if [ "$ACTUAL_ID" != "$IOS_ADMOB_APP_ID" ]; then
            echo "::error::Built app has an unexpected AdMob app ID: $ACTUAL_ID"
            exit 1
          fi
          echo "Verified packaged app AdMob ID: $ACTUAL_ID"
          IPA_DIR="$RUNNER_TEMP/unsigned-ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && zip -qry "$GITHUB_WORKSPACE/FlappyCraftz-Unsigned.ipa" Payload)
          unzip -t "$GITHUB_WORKSPACE/FlappyCraftz-Unsigned.ipa" >/dev/null
          cp "$APP/Info.plist" "$GITHUB_WORKSPACE/BuiltApp-Info.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlappyCraftz-IPA
          path: |
            FlappyCraftz-Unsigned.ipa
            BuiltApp-Info.plist
          if-no-files-found: error
